<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QA — Responsividade Lucas Luz</title><style>body{margin:20px;background:#dedfd5;font-family:sans-serif}section{margin:20px 0}iframe{border:1px solid #899283;display:block;background:white}h2{font-size:16px}output{display:block;padding:20px;background:#f8f8ef;white-space:pre-wrap;position:sticky;top:0;z-index:2}</style></head><body><h1>Verificação local de responsividade</h1><p>Harness de desenvolvimento. Não incluído no build de produção.</p><output id="results">Aguardando medições…</output><section><h2>360 px</h2><iframe title="360" src="/?qa=1" width="360" height="900"></iframe></section><section><h2>390 px</h2><iframe title="390" src="/?qa=1" width="390" height="900"></iframe></section><section><h2>768 px</h2><iframe title="768" src="/?qa=1" width="768" height="900"></iframe></section><section><h2>1024 px</h2><iframe title="1024" src="/?qa=1" width="1024" height="900"></iframe></section><section><h2>1440 px</h2><iframe title="1440" src="/?qa=1" width="1440" height="900"></iframe></section><section><h2>1920 px</h2><iframe title="1920" src="/?qa=1" width="1920" height="900"></iframe></section><script type="module">const results=new Map();addEventListener('message',e=>{if(e.origin!==location.origin||e.data?.type!=='lucas-responsive-qa')return;results.set(e.data.width,e.data);document.getElementById('results').textContent=[...results.values()].sort((a,b)=>a.width-b.width).map(r=>JSON.stringify(r)).join('\n')})</script></body></html>
